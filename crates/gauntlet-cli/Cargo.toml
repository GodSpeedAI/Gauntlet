[package]
name = "gauntlet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

[features]
# Plan Task 21 (charter D1): the DEFAULT build is byte-for-byte today's
# CLI-only build (AK-061). `surfaces` is the ONLY feature edge in the
# workspace: it enables the JSON operator surface adapter (spec 20.2)
# and, with it, the `gauntlet serve` command. A non-default,
# feature-gated dependency — never a default one.
default = []
surfaces = ["dep:gauntlet-adapter-surface-json"]

[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
# Plan Task 21 (charter D2): the JSON operator surface adapter — the
# §20.2 HTTP surface over the OperatorSurface port, served by
# `gauntlet serve`. OPTIONAL: enabled only by the `surfaces` feature
# above; the adapter's deps are ports + domain (it must not reach the
# application layer).
gauntlet-adapter-surface-json = { workspace = true, optional = true }
# Plan Task 20 (the audited §7.1 seam, widened from the dev-only edge by
# THIS manifest act — see crates/gauntlet-arch-tests/src/deps.rs's
# composition seal, which admits exactly this production edge and the
# original dev edge): the run composition constructs the §14.2 rung set
# (`Ladder::new`), so a normal build of the composition root carries the
# sealed constructors.
gauntlet-app = { workspace = true, features = ["composition"] }
# Plan Task 14: the FIRST production adapter wiring in the composition
# root — `gauntlet doctor` MEASURES the configured sandbox backend (§8.5
# check 4) by validating a minimal policy through the real backend and
# reporting the achieved isolation rung. Only capability-named façades
# are used; no vendor-flavored item name is spelled in this crate (the
# boundary suite masks the crate name only).
gauntlet-adapter-sandbox-bwrap.workspace = true
# Plan Task 15: `gauntlet doctor` MEASURES the configured default runner
# (§8.5 check 3) by probing the real delegation harness through the
# runner adapter's typed version probe (the supported range comes from
# the app defaults module). Only the adapter crate name and its
# capability-named surface are spelled here; the boundary suite masks
# the crate name only.
gauntlet-adapter-agent-prime.workspace = true
# Plan Task 16: `gauntlet doctor` MEASURES the configured generic CLI
# runner (§8.5 check 3) through the adapter's typed CONFIGURATION probe —
# the command template from GAUNTLET_CLI_AGENT_CMD must parse with only
# known, whole-word placeholders (no binary is touched; RES-D6's
# configuration probe kind). Only capability-named items are used; the
# boundary suite masks the crate name only.
gauntlet-adapter-agent-cli.workspace = true

# Plan Task 20: the run composition (brief Item 2) — the production wiring
# that fronts the REAL adapters the loop composes: the embedded state
# store, the fs evidence/escalation/workspace providers, the budget meter,
# the comparison sources, the fs policy provider behind a live backend,
# the observation instruments, the deterministic verification rungs, the
# production ULID ids, and the mock runner the E2E selects by token. The
# composition root is the one crate allowed to name adapters (spec 4.1);
# the boundary suite masks the crate name only.
gauntlet-adapter-state-sqlite.workspace = true
gauntlet-adapter-evidence-fs.workspace = true
gauntlet-adapter-escalation-fs.workspace = true
gauntlet-adapter-id-entropy.workspace = true
gauntlet-adapter-workspace-fs.workspace = true
gauntlet-adapter-meter-memory.workspace = true
gauntlet-adapter-compare-diff.workspace = true
gauntlet-adapter-compare-model.workspace = true
gauntlet-adapter-policy-fs.workspace = true
gauntlet-adapter-agent-mock.workspace = true
gauntlet-adapter-observe-test.workspace = true
gauntlet-adapter-observe-build.workspace = true
gauntlet-adapter-observe-filesystem.workspace = true
gauntlet-adapter-observe-git.workspace = true
gauntlet-adapter-verify-command-exit-code.workspace = true
gauntlet-adapter-verify-file-digest.workspace = true
gauntlet-adapter-verify-test-report.workspace = true

# Spec §4.1, plan Task 20: the CLI is the composition root — the only crate
# that may construct adapters and wire them into the application layer.
# Adapter dependencies land with their tasks; declaring them early would let
# this stub grow wiring before there is anything to wire.
#
# Task 6 correction round: the export-stack composition test
# (tests/export_stack.rs) wires the REAL embedded-SQL state adapter under
# the application layer's export — the composition root is the one crate
# allowed to name adapters (spec §4.1; the boundary suite accepts cli
# wiring and flags the reverse), and a dev-dependency is the narrowest form
# of that freedom: no production wiring exists yet. The test uses the
# adapter's capability-named export; a vendor-flavored type name cannot be
# spelled in this crate (the denylist masks the crate name only).
#
# Task 7 adds the fs evidence adapter the same way: the P1 proof
# (tests/p1_reference_integrity.rs) freezes the reference through the REAL
# content-addressed store. Still dev-only — the production wiring lands with
# the plan-task composition that needs it.
[dev-dependencies]
gauntlet-adapter-state-sqlite.workspace = true
gauntlet-adapter-evidence-fs.workspace = true
# Task 11 correction round 1 (C1/B-M1): the p12 proof Wires the rung set at
# the composition root, which requires the application layer's audited
# `composition` feature (the §7.1 seam — the ONLY edge in the workspace that
# enables it; no production dependency does, so `Ladder::new` and friends do
# not exist in a normal build of any crate).
gauntlet-app = { workspace = true, features = ["composition"] }
# Task 9 adds the observe adapters + the mock runner the same way: the P3
# and G6 proofs (tests/p3_real_observation.rs,
# tests/g6_hide_failed_observations.rs) compose REAL observers over the
# Task-8 lying-builder fixture and assemble bundles through the
# application layer's assembler. Still dev-only — production wiring lands
# with the plan-task composition that needs it (Tasks 12/15).
gauntlet-adapter-agent-mock.workspace = true
gauntlet-adapter-observe-filesystem.workspace = true
gauntlet-adapter-observe-git.workspace = true
gauntlet-adapter-observe-build.workspace = true
gauntlet-adapter-observe-test.workspace = true
gauntlet-adapter-observe-command.workspace = true
# Task 10 adds the deterministic comparator the same way: the P2 proof
# (tests/p2_context_isolation.rs) runs the REAL compare-diff adapter over
# the composed §13.2 envelope. Still dev-only — production wiring lands
# with the plan-task composition that needs it (Tasks 12/20).
gauntlet-adapter-compare-diff.workspace = true
# Task 10 durable critic-binding proof composes the model adapter with the
# application recording boundary and real durable adapters.
gauntlet-adapter-compare-model.workspace = true
# Task 11 adds the four deterministic verifier adapters the same way: the
# P12 proof (tests/p12_missing_is_not_passing.rs) composes the REAL
# verification chain — the embedded state store, the fs evidence store, the
# earned verify:: chain, and these instruments — at the composition root.
# Still dev-only; production wiring lands with the plan-task composition
# that needs it (Tasks 12/20).
gauntlet-adapter-verify-command-exit-code.workspace = true
gauntlet-adapter-verify-test-report.workspace = true
gauntlet-adapter-verify-file-digest.workspace = true
gauntlet-adapter-verify-schema-check.workspace = true
# Task 12 adds the budget-meter adapter the same way: the P4/P6 proofs
# (tests/p4_corrective_loop.rs, tests/p6_budget_control.rs) compose the
# REAL controller over the REAL metered budget at the composition root
# (plan Task 12's gate spells those two test targets). Still dev-only —
# production wiring lands with the plan-task composition that needs it
# (Tasks 15/20).
gauntlet-adapter-meter-memory.workspace = true
# Task 14 adds the sandbox + policy adapters for the P5 proof
# (tests/p5_hard_gate.rs): the gate composes the REAL process-isolation
# backend and the REAL fs policy provider at the composition root. The
# the process-isolation adapter is ALSO a production dependency above (doctor check 4).
gauntlet-adapter-sandbox-bwrap.workspace = true
gauntlet-adapter-policy-fs.workspace = true
