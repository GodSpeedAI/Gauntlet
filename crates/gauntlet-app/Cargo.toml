[package]
name = "gauntlet-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Task 11 correction round 1 (C1/B-M1): the 14.2 ladder is earned authority
# — injected when a governed verification opens — so its constructors
# (`Ladder::new`, `LadderRung::new`, `ModelRung::rung`) do not exist in a
# normal build of this crate. The `composition` feature is the audited
# §7.1 seam at which a composition root (the CLI's proof wiring; the
# production wiring of Tasks 12/20) builds the rung set; enabling it is a
# deliberate, manifest-visible act, and no production dependency edge of
# this workspace enables it.
[features]
composition = []
# TEST-ONLY park points (the e2e recovery placement). Compiled in ONLY when a
# test target enables it: gauntlet-cli enables it from its [dev-dependencies]
# alone, and resolver 3 keeps dev-dependency features out of a plain
# `cargo build`. Never enabled by any normal dependency or default feature.
test-park = []

[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
# Plan Task 5, spec §8.1: the config_fingerprint digest. The one external
# dependency on the application allowlist (crates/gauntlet-arch-tests/src/
# deps.rs), reused by plan Task 7's reference digest.
sha2.workspace = true

# Spec §4.1/§24.3: the application layer depends on domain and ports only —
# never on adapters. Replacing a provider must not require editing this crate;
# `src/config/` is the declared defaults module (plan Task 5), the one place
# environment literals are permitted.
