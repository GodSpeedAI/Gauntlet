[package]
name = "gauntlet-adapter-tool-program-codemode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Spec §4.1/§24.3: adapters depend on domain and ports only — never on
# gauntlet-app or gauntlet-cli. This adapter runs the ToolProgramRuntime port
# by spawning the Bun codemode host (workbench/src/codemode/PROTOCOL.md) and
# speaking its JSONL protocol over stdio. Std-only; no external dependency.
[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
