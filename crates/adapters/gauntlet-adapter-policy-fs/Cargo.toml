[package]
name = "gauntlet-adapter-policy-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Spec §4.1/§24.3: adapters depend on domain and ports only — never on
# gauntlet-app or gauntlet-cli. The filesystem policy adapter reads the
# repo-owned per-tier sandbox policy artifacts (spec §25 layout) through
# the ports crate's own strict JSON reader — no external dependency is
# added: "Resolves repo-owned policy artifacts; no policy is compiled in"
# (spec §6.2).

# Declared direction (plan Task 2 step 2, spec §4.1): an adapter implements
# port traits over domain types. Declaring these makes the direction a fact in
# the manifest, not only an upper bound the boundary tests decline to exceed.
[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
