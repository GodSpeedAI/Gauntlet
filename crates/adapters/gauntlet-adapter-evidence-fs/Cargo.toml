[package]
name = "gauntlet-adapter-evidence-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Spec §4.1/§24.3: adapters depend on domain and ports only — never on
# gauntlet-app or gauntlet-cli. Provider-specific code belongs here and only
# here; the port traits this adapter implements land in plan Task 4.

# Declared direction (plan Task 2 step 2, spec §4.1): an adapter implements
# port traits over domain types. Declaring these makes the direction a fact in
# the manifest, not only an upper bound the boundary tests decline to exceed.
[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
# Plan Task 6: content addressing for evidence — `put(bytes, kind)` derives
# the ref from the bytes' SHA-256, and std has no SHA-256. On the adapter
# external allowlist (crates/gauntlet-arch-tests/src/deps.rs) with that
# recorded justification. Inherited from the root table, where the
# application layer already carries the same crate for the §8.1 config
# fingerprint; a new vendor entry in the root table is what the denylist
# forbids, and sha2 is already there.
sha2.workspace = true
