# Verification evidence store for the harness catalog (see CATALOG.md, "Verification tiers").
# Parsed and validated by src/verification.rs. Strict: unknown keys, harnesses, fields, kinds
# and malformed dates are rejected. Records are facts about one harness field and the evidence
# behind them. Nothing here runs a harness with a prompt.
