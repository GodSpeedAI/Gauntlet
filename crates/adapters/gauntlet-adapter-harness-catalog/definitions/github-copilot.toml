schema = 1
id = "github-copilot"
label = "GitHub Copilot"
executables = ['copilot', 'github-copilot', 'ghcs']

[provenance]
source = "herdr"
commit = "4e624cd"
refs = ["src/detect/mod.rs:212", "src/detect/manifests/github-copilot.toml"]
license = "Apache-2.0"

[launch]
args = []
prompt_mode = "unknown"

[session]
identity = "id"
resume_argv = [ '--resume={session}']

[lifecycle]
source = "screen"
detection_manifest = "github-copilot"

[control]
interrupt = "none"

[capabilities]
interactive = false
resumable = true
model_selection = false
native_subagents = false
structured_events = false
support_level = 0
