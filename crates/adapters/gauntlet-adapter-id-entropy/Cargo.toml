[package]
name = "gauntlet-adapter-id-entropy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Spec §4.1/§24.3: adapters depend on domain and ports only — never on
# gauntlet-app or gauntlet-cli. Provider-specific code belongs here and only
# here.

# Std-only: entropy comes from the operating system's random device, the
# avalanche from the same public-domain primitives the seeded sibling uses,
# so the adapter external allowlist is untouched.
[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
