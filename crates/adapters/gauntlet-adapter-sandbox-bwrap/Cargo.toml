[package]
name = "gauntlet-adapter-sandbox-bwrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Spec §4.1/§24.3: adapters depend on domain and ports only — never on
# gauntlet-app or gauntlet-cli. This adapter fronts the bubblewrap
# user-space sandbox (the Task-0 adjudicated strongest real backend on
# this host); the product name belongs here and only here (spec §24.3),
# behind the semantic Sandbox port. No substrate beyond the two layers
# every adapter may name: process control is std.

# Declared direction (plan Task 2 step 2, spec §4.1): an adapter implements
# port traits over domain types. Declaring these makes the direction a fact in
# the manifest, not only an upper bound the boundary tests decline to exceed.
[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
