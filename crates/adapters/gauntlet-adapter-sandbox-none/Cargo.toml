[package]
name = "gauntlet-adapter-sandbox-none"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

# Spec §4.1/§24.3: adapters depend on domain and ports only — never on
# gauntlet-app or gauntlet-cli. The no-backend sandbox adapter is pure
# policy arithmetic (spec §17.3: backend none is permitted only at the
# contained tier), so it needs no substrate beyond the two layers every
# adapter may name.

# Declared direction (plan Task 2 step 2, spec §4.1): an adapter implements
# port traits over domain types. Declaring these makes the direction a fact in
# the manifest, not only an upper bound the boundary tests decline to exceed.
[dependencies]
gauntlet-domain.workspace = true
gauntlet-ports.workspace = true
