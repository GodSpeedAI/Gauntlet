[package]
name = "gauntlet-arch-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true

[dependencies]
# The single dependency plan Task 2 permits: manifest parsing. This crate is
# test-only — it is not (and must never become) a dependency of any other
# workspace member, and it depends on no internal crate.
toml.workspace = true

# Evidence locators (spec Annex A): the frozen answer key addresses this work
# at `tests/contract/<name>`, so those are declared here as cargo test targets
# whose NAME matches the locator and whose PATH is the repo-root
# `tests/contract/` directory. A verifier resolving AK-001/AK-002/AK-014/
# AK-016/AK-019 finds a real, runnable target rather than an empty directory.
# The checking logic lives in `src/`; these files are the address.
[[test]]
name = "architecture_boundaries"
path = "../../tests/contract/architecture_boundaries.rs"

[[test]]
name = "adapter_registry"
path = "../../tests/contract/adapter_registry.rs"

[[test]]
name = "no_hardcoded_literals"
path = "../../tests/contract/no_hardcoded_literals.rs"

[[test]]
name = "env_example_complete"
path = "../../tests/contract/env_example_complete.rs"

# AK-068 (spec §25, plan Task 27): the frozen locator names this target.
[[test]]
name = "docs_present"
path = "../../tests/contract/docs_present.rs"
