# Gauntlet runtime workspace (spec §4.1 layering, plan Task 2).
#
# Dependency direction is architectural, not conventional (spec §24.3): it is
# enforced mechanically by crates/gauntlet-arch-tests, run as `just boundaries`.
#   gauntlet-domain     -> no internal deps
#   gauntlet-ports      -> domain
#   gauntlet-app        -> domain, ports
#   gauntlet-cli        -> domain, ports, app (the composition root)
#   crates/adapters/*   -> domain, ports (never app or cli)
#   gauntlet-arch-tests -> no internal deps; test-only, never a dependency

[workspace]
resolver = "3"
members = [
    "crates/gauntlet-domain",
    "crates/gauntlet-ports",
    "crates/gauntlet-app",
    "crates/gauntlet-cli",
    "crates/adapters/gauntlet-adapter-agent-mock",
    "crates/adapters/gauntlet-adapter-agent-prime",
    "crates/adapters/gauntlet-adapter-agent-cli",
    "crates/adapters/gauntlet-adapter-state-sqlite",
    "crates/adapters/gauntlet-adapter-evidence-fs",
    "crates/adapters/gauntlet-adapter-workspace-fs",
    "crates/adapters/gauntlet-adapter-escalation-fs",
    "crates/adapters/gauntlet-adapter-id-entropy",
    "crates/adapters/gauntlet-adapter-meter-memory",
    "crates/adapters/gauntlet-adapter-observe-filesystem",
    "crates/adapters/gauntlet-adapter-observe-git",
    "crates/adapters/gauntlet-adapter-observe-build",
    "crates/adapters/gauntlet-adapter-observe-test",
    "crates/adapters/gauntlet-adapter-observe-command",
    "crates/adapters/gauntlet-adapter-compare-diff",
    "crates/adapters/gauntlet-adapter-compare-model",
    "crates/adapters/gauntlet-adapter-policy-fs",
    "crates/adapters/gauntlet-adapter-sandbox-bwrap",
    "crates/adapters/gauntlet-adapter-sandbox-none",
    "crates/adapters/gauntlet-adapter-verify-command-exit-code",
    "crates/adapters/gauntlet-adapter-verify-test-report",
    "crates/adapters/gauntlet-adapter-verify-file-digest",
    "crates/adapters/gauntlet-adapter-verify-schema-check",
    "crates/adapters/gauntlet-adapter-surface-json",
    "crates/gauntlet-arch-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
gauntlet-domain = { path = "crates/gauntlet-domain" }
gauntlet-ports = { path = "crates/gauntlet-ports" }
gauntlet-app = { path = "crates/gauntlet-app" }
gauntlet-adapter-agent-mock = { path = "crates/adapters/gauntlet-adapter-agent-mock" }
gauntlet-adapter-agent-prime = { path = "crates/adapters/gauntlet-adapter-agent-prime" }
gauntlet-adapter-agent-cli = { path = "crates/adapters/gauntlet-adapter-agent-cli" }
gauntlet-adapter-state-sqlite = { path = "crates/adapters/gauntlet-adapter-state-sqlite" }
gauntlet-adapter-evidence-fs = { path = "crates/adapters/gauntlet-adapter-evidence-fs" }
gauntlet-adapter-workspace-fs = { path = "crates/adapters/gauntlet-adapter-workspace-fs" }
gauntlet-adapter-escalation-fs = { path = "crates/adapters/gauntlet-adapter-escalation-fs" }
gauntlet-adapter-id-entropy = { path = "crates/adapters/gauntlet-adapter-id-entropy" }
gauntlet-adapter-meter-memory = { path = "crates/adapters/gauntlet-adapter-meter-memory" }
gauntlet-adapter-observe-filesystem = { path = "crates/adapters/gauntlet-adapter-observe-filesystem" }
gauntlet-adapter-observe-git = { path = "crates/adapters/gauntlet-adapter-observe-git" }
gauntlet-adapter-observe-build = { path = "crates/adapters/gauntlet-adapter-observe-build" }
gauntlet-adapter-observe-test = { path = "crates/adapters/gauntlet-adapter-observe-test" }
gauntlet-adapter-observe-command = { path = "crates/adapters/gauntlet-adapter-observe-command" }
gauntlet-adapter-compare-diff = { path = "crates/adapters/gauntlet-adapter-compare-diff" }
gauntlet-adapter-verify-command-exit-code = { path = "crates/adapters/gauntlet-adapter-verify-command-exit-code" }
gauntlet-adapter-verify-test-report = { path = "crates/adapters/gauntlet-adapter-verify-test-report" }
gauntlet-adapter-verify-file-digest = { path = "crates/adapters/gauntlet-adapter-verify-file-digest" }
gauntlet-adapter-verify-schema-check = { path = "crates/adapters/gauntlet-adapter-verify-schema-check" }
gauntlet-adapter-compare-model = { path = "crates/adapters/gauntlet-adapter-compare-model" }
gauntlet-adapter-policy-fs = { path = "crates/adapters/gauntlet-adapter-policy-fs" }
gauntlet-adapter-sandbox-bwrap = { path = "crates/adapters/gauntlet-adapter-sandbox-bwrap" }
gauntlet-adapter-sandbox-none = { path = "crates/adapters/gauntlet-adapter-sandbox-none" }
# Plan Task 21 (charter D2): the JSON operator surface adapter — the §20.2
# HTTP surface over the OperatorSurface port. Std-only; deps are ports +
# domain only. NON-default: gauntlet-cli's `surfaces` feature is the only
# edge that enables it (charter D1 — the default build stays CLI-only).
gauntlet-adapter-surface-json = { path = "crates/adapters/gauntlet-adapter-surface-json" }
# The one external dependency permitted by plan Task 2: manifest parsing for
# the architecture boundary tests. gauntlet-arch-tests is NOT listed above as
# anything's dependency — it is test-only.
toml = "0.9"
# Plan Task 5: the §8.1 config_fingerprint digest (spec §8.1 "digested into
# Run.config_fingerprint"); reused by plan Task 7's reference digest. On the
# application external allowlist with this recorded justification — std has
# no SHA-256.
sha2 = "0.10"

# Memory economy on constrained hosts (plan Task 0 environment report):
# line tables keep backtraces useful without full debug info.
[profile.dev]
debug = "line-tables-only"
