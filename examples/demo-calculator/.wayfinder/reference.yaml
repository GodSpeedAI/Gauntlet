# Reference manifest for the demo-calculator project (spec §5.3.1, §9).
# The checkable-Unit projection lives separately in
# .wayfinder/answer-key.md (AK-9011..AK-9013); `units` below stays
# empty so the two never become competing copies — the same discipline
# the repository's own reference manifest and E2E fixture hold. The
# field set is the strict closed manifest shape: NO cohort key exists on
# any shipped surface (charter D7).
reference:
  id: gauntlet-demo-calculator
  version: 1
  digest: null

  source_refs:
    - calculator.html

  purpose: >
    A tiny, always-available demo project: dispatch a real agent to build
    a single-page HTML calculator, then verify the result with a real,
    deterministic, no-network check command.

  desired_state: >
    calculator.html exists at the project root, presents digit and
    operator buttons for add/subtract/multiply/divide, and its evaluation
    path produces correct results for simple expressions — verified by
    scripts/check.sh, not by the agent's own claim.

  invariants:
    - id: I1
      statement: The builder never modifies the standard its work is evaluated against.
    - id: I8
      statement: Missing evidence is not passing evidence.

  constraints:
    - Only the shipped `none` sandbox posture is exercised; units are tier
      `contained` with authority `critic` because that posture admits nothing
      else.
    - No network access and no build step — calculator.html must work when
      opened as a plain static file.

  anti_goals:
    - The demo reference expressing a cohort on any shipped surface.
    - A settlement whose evidence is the builder's claim rather than an
      instrument's record.

  units: []

  quality_dimensions: []

  settlement:
    success_criteria:
      - every blocking unit of the demo reference is settled with PASS
        verification and pinned instrument evidence
    required_evidence:
      - scripts/check.sh's real exit status, observed by an instrument the
        runtime composes
    minimum_reliability: >
      demo posture: >= 1 settlements is the smallest loop this demo needs to
      observe end to end; a single clean run never promotes anything.
    terminal_conditions: [settled, blocked, budget_exhausted, escalated, aborted, inconclusive]
