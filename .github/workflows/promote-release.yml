name: Promote release (qualification)

# Input-free promotion of a PUBLISHED prerelease. Native builds are not
# byte-reproducible, so real-hardware evidence (the Jetson) can only be
# produced AFTER publication, against that release's own assets:
#
#   1. publish creates the release as a prerelease with the hosted records;
#   2. the operator downloads the release's arm64 assets, runs
#      packaging/qualify-local.sh on the Jetson, and uploads the record:
#        gh release upload <tag> qualification-linux-arm64-jetson.json
#   3. this workflow (Actions -> Promote release -> Use workflow from: the TAG)
#      re-aggregates every record asset, rejects any record whose artifact
#      sha256 does not match the release's own SHA256SUMS, regenerates the
#      readiness table in the notes, and flips prerelease -> release ONLY IF
#      every claimed platform is QUALIFIED and the release carries the
#      provenance marker written by publish.
#
# There are no inputs: the release is the one named by the tag the workflow
# was started from. It never creates tags, builds, or moves assets; it only
# edits the notes, replaces qualification.json / QUALIFICATION.md, and the
# prerelease flag. Pinned to full action SHAs; contents: write only here.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    name: promote (re-aggregate, regenerate notes, flip prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require a gauntlet-v* tag
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag || { echo "::error::start this workflow from a gauntlet-v* tag"; exit 1; }
          case "$TAG" in gauntlet-v*) ;; *) echo "::error::tag $TAG does not match gauntlet-v*"; exit 1 ;; esac

      - name: Checkout the tag (qualification tooling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the release's own records and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p records dist out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir records --pattern 'qualification-*.json'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern SHA256SUMS
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease,isDraft \
            --jq '.body' > old-notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft > state.json
          ls records

      - name: Re-aggregate and regenerate the readiness block
        id: agg
        run: |
          set -euo pipefail
          version=${TAG#gauntlet-v}
          tag_sha=$(git rev-parse HEAD)
          attested=false
          grep -q '<!-- provenance:attested -->' old-notes.md && attested=true
          grep -q '<!-- readiness:begin -->' old-notes.md && grep -q '<!-- readiness:end -->' old-notes.md \
            || { echo "::error::the release notes carry no readiness markers; this release predates qualification and cannot be promoted"; exit 1; }
          python3 -I packaging/qualify.py aggregate \
            --platforms packaging/qualification-platforms.json --records records \
            --dist-sums dist/SHA256SUMS --version "$version" --commit "$tag_sha" --attested "$attested" \
            --signing-note "unsigned (no Apple Developer ID / Authenticode signing is configured)" \
            --provenance-note "Re-aggregated by the promote workflow from the release's own record assets." \
            --out-json out/qualification.json --out-md out/QUALIFICATION.md > /dev/null
          python3 -I packaging/qualify.py notes --json out/qualification.json --attested "$attested" > out/block.md
          python3 -I - <<'PY'
          import re
          old = open("old-notes.md", encoding="utf-8").read()
          block = open("out/block.md", encoding="utf-8").read().rstrip("\n")
          new = re.sub(r"<!-- readiness:begin -->.*?<!-- readiness:end -->", lambda m: block, old, count=1, flags=re.S)
          open("out/notes.md", "w", encoding="utf-8").write(new)
          PY
          ready=$(python3 -I -c 'import json;print("true" if json.load(open("out/qualification.json"))["release_ready"] else "false")')
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "attested=$attested" >> "$GITHUB_OUTPUT"
          cp out/QUALIFICATION.md "$GITHUB_STEP_SUMMARY"

      - name: Update the release (notes, records; prerelease flag only if fully qualified)
        env:
          READY: ${{ steps.agg.outputs.ready }}
          ATTESTED: ${{ steps.agg.outputs.attested }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" out/qualification.json out/QUALIFICATION.md --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$READY" = "true" ] && [ "$ATTESTED" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file out/notes.md --prerelease=false
            echo "promoted: every claimed platform is QUALIFIED and the release is attested"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file out/notes.md
            echo "::notice::not promoted (ready=$READY attested=$ATTESTED): the release stays a prerelease"
          fi
