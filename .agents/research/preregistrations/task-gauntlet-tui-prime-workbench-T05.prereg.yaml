pre_run:
  current_problem_model:
    summary: >
      Task T05 exploits Prime's persistent Python REPL substrate for sequential deterministic
      computation, host-mediated input/control, explicit kernel-object references, and safe separation
      between kernel liveness/computation and Gauntlet truth. It proves that one Prime kernel serializes
      shell execution (concurrent execute requests are queued/serialized), input/control is mediated through
      Prime, kernel objects are classed into ephemeral/pinned/artifactized, and kernel liveness is never
      confused with work success.

    important_distinctions:
      - id: D1
        statement: >
          Execution serialization: A single Prime Python REPL session MUST serialize execution requests;
          concurrent requests against the same session must be queued deterministically, never interleaved
          or allowed to race (Attack 1).
      - id: D2
        statement: >
          Kernel object taxonomy: Objects are classed into 'ephemeral' (in-memory REPL variables),
          'pinned' (retained working set across cells), and 'artifactized' (persisted to disk with evidence).
      - id: D3
        statement: >
          Kernel liveness != work success. A REPL session remaining open/alive is purely an infrastructure
          state; task success requires verified settlement under Gauntlet gates (REQ-SAFE-004).

    known_blindspots:
      - "Kernel interrupt signaling under runaway loops."
      - "Handling of large stdout/stderr chunks from user Python code."

  visible_intervention_classes:
    - id: A1
      class: "Python REPL session manager and execution queue in workbench/src/prime-kernel.ts"
      why_visible_now: "Implements serial execution, interrupt semantics, and object lifecycle."
    - id: A2
      class: "Automated test suite and teeth attacks in workbench/src/prime-kernel.test.ts"
      why_visible_now: "Gate requires just tui-test prime-kernel and teeth validation."

  predictions:
    - id: P1
      claim: "Attempting two concurrent execute requests against the same Prime Python REPL session executes them sequentially without race conditions."
      kind: "implementation_defect"
      supporting_observation: "Second execution waits until first finishes; results are ordered deterministically."
      disconfirming_observation: "Concurrent execution requests interleave stdout or corrupt REPL state."
    - id: P2
      claim: "A live kernel session with active variables cannot settle a unit without verified evidence artifact."
      kind: "representation_inadequacy"
      supporting_observation: "Unit status remains uncompleted despite live kernel state."
      disconfirming_observation: "Kernel liveness is credited as task completion."

  representation_revision_triggers:
    - id: R1
      trigger: >
        If Prime REPL substrate protocol changes or ACP interface requires protocol migration.

  predicted_revision_effects:
    - trigger_ref: R1
      expected_new_intervention_class: "Update REPL JSON-RPC protocol adapter."

  transfer_tests:
    replay:
      level: L1
      description: "Concurrent execute requests against same kernel session."
      preregistered_expectation: "Serialized execution queue."
    parametric_variation:
      level: L2
      description: "Ephemeral vs Pinned vs Artifactized kernel object transitions."
      preregistered_expectation: "Object lifecycle taxonomy holds."
