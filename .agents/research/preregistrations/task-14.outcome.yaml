representation_change:
  occurred: true
  before: >-
    A denied path is a MASK RENDERED INTO AN ARGV. Containment is whatever
    string the adapter emits, and `validate` is a probe of the BACKEND (does
    `bwrap` start at all) plus a lint of the policy's fields.
  after: >-
    A mask is trustworthy exactly when it is a MOUNT POINT sitting directly
    inside a bound root — the kernel refuses to rename, remove, or clobber a
    mount point — and any other nesting is refused as a typed validation
    finding rather than served and silently degraded. Ordering is only half
    the guarantee; anchoring is the other half. `validate` is a real dry run
    OF THE POLICY (its own binds and masks), so a policy that would abort
    bubblewrap at process start escalates as `ValidationEscalated` instead of
    surfacing later as a spawn error.
  trigger_evidence:
    - ".agents/reports/task14/final-confirmation-round2-falsifier.md F1 MAJOR (nested `denied_paths` silently re-exposed read AND write; host file overwritten with `PWNED` end-to-end through real PolicyFs + gate + bubblewrap; the adapter's own doc comment stated the correct rule and the code implemented its inverse)"
    - ".agents/reports/task14/final-confirmation-round3-falsifier.md F2 MAJOR (the COR-4 ordering fix was itself defeated by a rename: `mv W/a W/b` using only policy-permitted writes, after which the next wrap under the IDENTICAL policy validated CLEAN, bubblewrap created the vacated path, the sandbox STARTED, and the payload was read and overwritten at its new location)"
    - ".agents/reports/task14/correction-round2.md COR-4; .agents/reports/task14/correction-round3.md COR-7, COR-8"

# Intervention classes that only became visible after the representation changed.
newly_visible_intervention_classes:
  - >-
    refuse_rather_than_serve_and_degrade: a policy shape the backend cannot
    actually enforce becomes a typed validation FINDING, never a best-effort
    render. Visible only once "a mask is a mount point" replaced "a mask is a
    rendered flag" — before that change there was no principled line between
    an enforceable and an unenforceable mask. Applied to relocatable nested
    denials (COR-7) and, by the same reasoning already present in B1, to
    allowlist network postures the backend cannot deliver.
  - >-
    one_table_not_two: a spec table (§17.3's tier -> isolation rung) is made
    IMPOSSIBLE to duplicate rather than cross-checked between copies. Round-4
    F4 showed the duplicate was undetectable — mutating the gate's table left
    all 32 doctor tests green — and COR-10 made `doctor::checks` read through
    `posture::dispatchable_posture` so a single mutation now fails a test.

