    AuthorityGate -> fs policy provider -> bubblewrap adapter), authority
    decides WHETHER and containment decides HOW CONTAINED, both strictly
    before the runner is invoked and in that order: the gate's six conjuncts
    are strictly conjunctive with no scoring or averaging path, an
    irreversible unit is refused at six independent non-overlapping points,
    an agent-originated lattice movement is refused in every direction, a
    validation failure escalates through a typed refusal with no arm
    convertible to unwrapped execution, a none-isolation runner is refused
    for every tier above contained, a present irreversible policy file fails
    doctor and the run, and a wrapped command's first process is the backend
    with live confinement demonstrated (process, IPC, uts, cgroup, user and
    network namespaces; no host process signallable; no daemon survives the
    wrap). Each of those is teeth-verified by a minimal inverting mutation
