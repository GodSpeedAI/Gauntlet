    NOT claimed: that a composed production run wraps a builder (no
    production caller of `wrap_builder_command` exists — AK-048's composed
    half lands with Tasks 15/16); that the surface is free of further
    defects (four consecutive executing rounds each found what the previous
    missed); or that any of this holds on a host other than the one measured.
