alternative_explanations:
  - >-
    The round-1 divergence of Task 13 did not merely repeat — it compounded.
    A spec critic that independently re-ran ten gates and mutation-verified
    four teeth legs returned CONFIRM on a tree that four subsequent executing
    rounds showed contained three MAJOR containment defects. The plausible
    alternative reading — "the executing rounds were lucky" — is weakened by
    the fact that each round broke the surface in a dimension the previous
    rounds had not examined at all, and by round 5's own conclusion: "this
    surface still yields to fresh attack angles, not that it is now
    exhausted." The evidential asymmetry to carry forward is that a
    reading-only CONFIRM is weak evidence about containment specifically,
    because containment claims are claims about kernel behaviour and reading
    an argv cannot observe kernel behaviour.
  - >-
    Every behavioural containment result rests on ONE host: WSL2, kernel
    6.18.35.2-microsoft, bubblewrap 0.11.1, unprivileged uid 1000. Namespace
    results are host facts, not portable guarantees. Round 5 explicitly notes
    that the `--unshare-cgroup` strictness would make the backend PROBE fail
    (honestly) on a host without cgroup namespaces, and that such a host was
    not tested.
  - >-
    The green standing battery is not independent evidence about containment.
    Every MAJOR found in rounds 1-4 was in code that had just passed a full
    green workspace battery, and round2-F1 was missed by every prior test for
    a structural reason worth keeping: every denied path in the suite was a
    SIBLING of the writable root, and nested is the only case in which
    "denied even if otherwise writable" has content.

