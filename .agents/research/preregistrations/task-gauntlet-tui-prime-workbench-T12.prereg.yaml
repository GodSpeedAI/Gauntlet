pre_run:
  current_problem_model:
    summary: >
      Task T12 builds the terminal-native semantic shell over immutable
      Workbench snapshots: Navigator/semantic outline, Work/Chat/Trace primary
      views, Inspector, Composer with temporary takeover, and contextual lower
      surfaces, preserving Focus identity and renderer non-authority. It
      proves an operator can navigate a Case, see multiple placements of the
      same Focus, hoist/de-hoist, switch among Work/Chat/Trace questions over
      the same history, inspect relations/evidence/affordances, and complete
      temporary composer takeovers without presentation owning domain state
      (REQ-DATA-005, REQ-GOAL-001/005, REQ-OUT-001, REQ-TUI-001..004,
      REQ-UX-001..007; DSN-001..010, DSN-013, DSN-015).

    important_distinctions:
      - id: D1
        statement: >
          Renderer non-authority: OpenTUI/React renderers lower from immutable
          snapshots and interaction callbacks only; no component-local
          authority predicate (DSN-005), no component owns business state
          (DSN-011 direction), and the shell operates only from Workbench
          snapshots/callbacks.
      - id: D2
        statement: >
          Placements over copies: Navigator, Work, Agent placement, and
          Inspector renderings of one Focus all update through one source
          identity/snapshot when source state changes once (falsifier);
          no view-local canonical copy diverges.
      - id: D3
        statement: >
          Geometry floors are conformance, not preference: full three-surface
          layout at 120x40, one primary pane at 80x24, recoverable
          compact-size prompt below 80x24 with re-entry preserving semantic
          location and terminal modes (DSN-007, REQ-UX-005).
      - id: D4
        statement: >
          Presentation semantics without colour: semantic token indirection
          with no raw colour literals outside theme adapters (DSN-001);
          monochrome/no-color remains distinguishable by glyph, label,
          emphasis, ordering (DSN-002); gold reserved for proof and sanctioned
          authority (DSN-003); distinct token families (DSN-004).
      - id: D5
        statement: >
          Evidence/authority render as inspectable record objects (DSN-008);
          blocked-with-reason vs absent-but-palette-discoverable (DSN-009);
          Chat subordinate to durable execution history (DSN-010); optional
          motion with a reduced-motion mode (DSN-013).
      - id: D6
        statement: >
          Composer takeover is temporary: kernel-input/approval/question/
          recovery takeover owns the interaction, then the original composer
          state returns unless canonical state explicitly replaced it; drafts
          preserved, stale answers handled, keyboard-only throughout.
      - id: D7
        statement: >
          No roadmap surfaces: no Harness View, no Skill/HarnessRevision
          Focus renderer, no refinement lifecycle UI, no second production
          renderer (DSN-015). Lower surfaces only where a provider exists;
          Domain promotable only with a bound model (T14 later).

    known_blindspots:
      - "Real-PTY journey acceptance requires a rendered terminal; component-level bun tests plus recorded journey procedures bound this until T20's real-target qualification."
      - "Embedded terminal and plugin slots are T13/T15; T12 exposes only implemented provider-backed surfaces."

  visible_intervention_classes:
    - id: A1
      class: "Semantic shell structure (Navigator/Primary/Inspector surfaces, view registry, keyboard routing) over WorkbenchModel snapshots"
      why_visible_now: "Implements the Surface/View/Focus vocabulary and REQ-TUI-001..004."
    - id: A2
      class: "Work/Chat/Trace projection views + Inspector sections + Composer with takeover states"
      why_visible_now: "Implements the primary projections, DSN-008/009/010, and the takeover falsifier surface."
    - id: A3
      class: "Theme/token adapter + geometry classes + reduced-motion mode"
      why_visible_now: "Implements DSN-001..004, DSN-007, DSN-013 and the raw-colour-literal ban."
    - id: A4
      class: "Gate suites opentui-shell, composer-takeover, work-chat-trace, operator-journeys, keyboard-accessibility"
      why_visible_now: "Declared narrow gates for this task."

  predictions:
    - id: P1
      claim: >
        Opening the same Focus in Navigator, Work, Agent placement, and
        Inspector, then updating source state once, updates all placements
        through one source identity/snapshot; no view-local canonical copy
        diverges.
      kind: "implementation_defect"
      supporting_observation: "All four placements reflect the update from one published snapshot; identities identical."
      disconfirming_observation: "Any placement keeps its own stale copy or diverges after the update."
    - id: P2
      claim: >
        Triggering kernel-input takeover while the default composer holds text
        returns the original composer state after the takeover unless canonical
        state explicitly replaced it.
      kind: "representation_inadequacy"
      supporting_observation: "Draft text and composer mode restored after takeover completion."
      disconfirming_observation: "Takeover destroys the draft or permanently replaces composer state."

  representation_revision_triggers:
    - id: R1
      trigger: >
        If OpenTUI/React requires owning mutable business state to remain
        usable, that state moves into the Workbench Model rather than
        embedding synchronization logic in render components.

  predicted_revision_effects:
    - trigger_ref: R1
      expected_new_intervention_class: "Workbench Model extension, never component-owned domain state."

  transfer_tests:
    replay:
      level: L1
      description: "Replay a recorded journey (select, hoist, switch views, takeover) against a fresh shell instance."
      preregistered_expectation: "Same semantic locations and states; no renderer-owned residue."
    parametric_variation:
      level: L2
      description: "Render at 120x40, 80x24, and below-minimum sizes; force monochrome and reduced-motion."
      preregistered_expectation: "Layout classes and lowered tokens conform at every size/mode."
