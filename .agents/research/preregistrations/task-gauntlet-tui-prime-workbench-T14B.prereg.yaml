schema_version: 1
task: "gauntlet-tui-prime-workbench-T14B"

frozen_at:
  git_commit: "HEAD"
  timestamp_utc: "2026-09-09T12:00:00Z"
  prereg_sha256: "see .agents/research/preregistrations/task-gauntlet-tui-prime-workbench-T14B.prereg.sha256"

source_scope:
  - ".agents/specs/gauntlet-tui-prime-workbench.spec.yaml"
  - ".agents/plans/gauntlet-tui-prime-workbench.plan.yaml"
