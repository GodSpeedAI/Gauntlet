pre_run:
  current_problem_model:
    summary: >
      Task T25 runs the preregistered end-to-end acceptance, variation,
      recovery, performance, plugin, semantic-enrichment, and cross-surface
      proof matrix on the real target and produces the final
      requirement-to-evidence/confirmation index. It proves an operator can
      enter/resume a real Case, focus/hoist, inspect the locally coherent
      world, invoke/delegate legitimate operations through isomorphic
      surfaces, observe Prime/Python execution live, detach/reattach,
      reconstruct after noncanonical loss, and settle evidence without the
      workbench becoming canonical (REQ-GOAL-001..006, REQ-OUT-001..004,
      REQ-SXR-004, REQ-UX-001/002/007, REQ-VERIFY-001..006; DSN coverage
      recomputed).

    important_distinctions:
      - id: D1
        statement: >
          Mechanical coverage recomputation: every REQUIRED source requirement
          (104 indexed) and all fifteen DSN-001..DSN-015 design clauses map to
          settled evidence; any unmapped/evidenceless REQUIRED id FAILS.
          DESIGN.md's bound hash re-verified; no roadmap surface built
          (DSN-015).
      - id: D2
        statement: >
          The real end-to-end Case runs: at least one Prime child, one kernel
          computation, one evidence-producing operation, one attention/composer
          interaction where applicable, one disconnect/reconnect, and final
          Gauntlet consequence. VAR-001..006 and RECOV-001..006 applicable to
          the declared support matrix pass; skipped required integration is
          nonconforming.
      - id: D3
        statement: >
          Final attacks: delete Bun SQLite and restart TUI/kernel before
          replaying the final recorded Case → equivalent consequential state
          reconstructs from authoritative sources; select a denied operation
          through the most permissive-looking projection while Prime children
          and plugins are active → denial holds, no side effect; run the final
          Case without DomainForge enrichment then with a real bound model →
          core semantics correct in both, enrichment adds source-identified
          relations without identity substitution.
      - id: D4
        statement: >
          A fresh independent verifier answers the spec quality-gate
          questions and issues final CONFIRM/REVISE; the orchestrator alone
          reviews total evidence and records whole-plan settlement. The
          final handoff carries settled/unsettled/roadmap items, support
          matrix, rollback/recovery, and the exact next action.

    known_blindspots:
      - "Roadmap capabilities (production libvaxis fallback, rich cross-model overlays, GUI/mobile, harness-metabolization UI) are explicitly NOT proven."
      - "Unsettled residuals recorded by earlier tasks keep their recorded boundaries; this task consolidates them into the handoff without re-proving each."

  visible_intervention_classes:
    - id: A1
      class: "Whole-system proof matrix execution + requirement/DSN coverage recomputation"
      why_visible_now: "The task IS the final conformance."
    - id: A2
      class: "Final gates: tui-test all, tui-bench all-required, tui-preflight conformance, tui-check, tui-lint, just verify, just ruler"
      why_visible_now: "Declared gates — including the two long-NOT_IMPLEMENTED modes (tui-test all / tui-preflight conformance) which must be REAL by this task."

  predictions:
    - id: P1
      claim: >
        Every REQUIRED requirement and DSN clause carries settled evidence
        with zero unmapped/failed coverage on the final tree; the bound
        spec/DESIGN hashes match.
      kind: "implementation_defect"
      supporting_observation: "Recomputed index complete; hashes verified."
      disconfirming_observation: "Any gap keeps the plan open."
    - id: P2
      claim: >
        The final real Case completes end-to-end through all required
        surfaces while the workbench never becomes canonical, and the three
        final attacks are repelled.
      kind: "representation_inadequacy"
      supporting_observation: "E2E artifact + repelled attacks recorded."
      disconfirming_observation: "Any canonical leak or unrepelled attack."

  representation_revision_triggers:
    - id: R1
      trigger: >
        Any failed high-risk confirmation, skipped required real integration,
        unmapped requirement, or documentation/status claim exceeding
        observed proof keeps the plan open; partial conformance is never
        settled.

  predicted_revision_effects:
    - trigger_ref: R1
      expected_new_intervention_class: "Targeted correction rounds; plan stays open until clean."

  transfer_tests:
    replay:
      level: L1
      description: "Re-run the full matrix after the last correction; results stable."
      preregistered_expectation: "All gates and attacks green on the final tree."
    parametric_variation:
      level: L2
      description: "VAR/RECOV variations across the declared support matrix."
      preregistered_expectation: "Every applicable case passes with stored evidence."
