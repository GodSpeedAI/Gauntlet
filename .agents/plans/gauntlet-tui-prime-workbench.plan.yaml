verification:
  global_gates:
  - id: GATE-TUI-CHECK
    command: just tui-check
  - id: GATE-TUI-TEST
    command: just tui-test
  - id: GATE-TUI-LINT
    command: just tui-lint
  - id: GATE-TUI-PREFLIGHT
    command: just tui-preflight bootstrap
  - id: GATE-REPO-VERIFY
    command: just verify
  - id: GATE-RULER
    command: just ruler
  gate_binding_rule: All tui-* commands are PROPOSED and absent at review time. T00 creates and verifies the argument/selector
    contracts of ALL SIX (tui-check, tui-test, tui-lint, tui-preflight, tui-bench, tui-build) before any downstream task
    dispatch; an unimplemented mode reports NOT_IMPLEMENTED and exits nonzero, never a green placeholder. Rust changes use
    package-scoped recipes (just check-package / test-package) in the inner loop. just verify delegates to ci = check/test/lint/deny/boundaries/ruler;
    wrappers cannot replace it or omit a gate. OBSERVED at plan revision, and a correction of the previous version of this
    clause — `just verify` runs `cargo nextest run --workspace` with DEFAULT features and therefore executes NO `surfaces`-gated
    test. The entire workbench read path (gauntlet serve, the seven-route JSON surface, its CLI integration tests) is behind
    that feature, so the current repository closure gate does not observe the surface T00A/T12/T20 depend on. T00 MUST
    close this before dispatching T00A, either by extending the repository gate to run the surfaces-enabled test selection
    or by binding an explicit additional global gate that does; a tui-* wrapper that merely reruns default-feature tests
    does not satisfy it. tui-preflight distinguishes document-integrity preflight from runtime qualification. Empty/unknown
    selectors, zero selected tests, missing artifacts or skipped required integrations fail.
  workbench_package_root: >-
    DECIDED at plan revision (closes the T00 open decision the 0.3.0 review recorded): a single new top-level directory
    `workbench/`, a sibling of `crates/`, not nested inside any Cargo crate and not loose at the repository root. Two
    verified facts drive this, not preference. First, `crates/gauntlet-arch-tests/src/walk.rs`'s `core_tree` walks every
    file under `crates/gauntlet-{domain,ports,app,cli}` with no extension filter, and its own header commits to treating
    a symlink, a non-UTF-8 file, or an oversized file as a hard violation rather than a skip — so nesting a Bun/TypeScript
    tree (node_modules symlinks and binaries included) under any of those four crates fails `just boundaries` on the first
    `bun install`, not from any workbench defect. Nesting under a non-core crate directory (e.g. `crates/adapters/...`)
    would dodge that scanner but misrepresent the tree the same way. Second, `REQ-TUI-005` requires OpenTUI stay a
    replaceable renderer; naming the root after the current renderer (`tui/`) would repeat the vendor-naming mistake
    AGENTS.md's Naming section already forbids for ports. `workbench/` matches the spec's own noun (Bun Workbench Host).
    DESIGN.md's React implementation structure resolves against `workbench/src/`. EXECUTED at plan revision (not
    just decided): the package root, pinned toolchain, and `tui-check`/`tui-test`/`tui-lint`/`tui-preflight bootstrap`
    recipes are wired and passing — see .agents/reports/gauntlet-tui-prime-workbench/evidence/T00/workbench-toolchain.md.
    This is one slice of T00, not the whole task.
  workbench_toolchain: >-
    DECIDED at plan revision: TypeScript in strict mode (`tsc --noEmit`, AGENTS.md Type checking), `bun test`, and Biome
    (`@biomejs/biome`) for combined lint + format-check. Biome over ESLint+Prettier: it is one pinned dependency instead
    of two-plus-a-config-bridge, a single Rust-native binary (no separate Node toolchain to install/audit), and covers
    both jobs `tui-lint` needs — AGENTS.md's Dependencies section weighs exactly these axes (does an existing choice
    already solve it, transitive cost, coupling) and Biome wins on all three against the ESLint+Prettier pair. If a
    required TypeScript/JSX/OpenTUI construct proves unsupported during T00A or T12, that is a recorded qualification
    failure (per T03's ledger discipline) and ESLint+Prettier become the qualified fallback for the unsupported case
    only — not a silent swap.
  workbench_gate_composition: >-
    Binds each Rust global gate's counterpart so `workbench/` inherits the same discipline `crates/` gets, none of it
    free: `tui-check` = `tsc --noEmit --strict` over `workbench/`. `tui-test` = `bun test` over `workbench/`, PLUS the
    boundary/architecture tests T07 (presentation owns no business state) and T19 (canonical layers cannot import
    OpenTUI/React) require — written as `bun test` cases under `workbench/`, not a second Rust scanner. `tui-lint` =
    `biome check workbench/` (lint and format-check together; a formatting diff fails the gate exactly as `cargo fmt
    --check` does). `tui-preflight` folds in T03's dependency-admission ledger plus `bun audit` plus a check that
    `workbench/bun.lock` is committed and unmodified by the run — the npm-equivalent of `cargo deny check`. `just verify`
    does NOT gain a TypeScript step by this binding (it stays the unchanged Rust closure gate per the existing rule
    above); `just tui-check`/`tui-test`/`tui-lint`/`tui-preflight` are the closure gates for `workbench/` and MUST run
    alongside `just verify` wherever a task's `gate:` lists both.
  confirmation_modes:
    builder: The builder's own declared gate and teeth suffice; no second party. Lowest mode, valid only at P0/P1.
    operator_journey: A human operator (or an agent acting as a cold operator without the originating conversation) executes
      the declared journey against the real rendered surface and records fixtures, keystrokes, observed states, errors,
      and the return path. Evidence is the recording plus the journey log, not a component snapshot. Valid at P1 for UX
      slices; it never substitutes for peer or independent confirmation of a behavioral claim.
    peer: A second party inside the plan's execution context reviews the claim against the evidence and reruns the declared
      gate/teeth. May receive builder context.
    independent: A fresh-context verifier receiving only the frozen requirements, the comparison contract, and the runtime-allowlisted
      observation bundle. Never receives builder reasoning, identity, history, or attempt counts.
    independent_adversarial: An independent verifier as above whose declared task is to break the claim — it executes the
      falsifiers itself rather than reading the builder's report of them. Corresponds to the spec's `adversarial` confirmation.
    fresh_target_reproduction: The claim is re-executed from a clean target state defined in the preregistration, on the
      actual installed substrate, without builder session state, caches, or fixtures.
  proof_levels:
    P0: Mechanical/deterministic change. Requires a narrow direct gate plus applicable global gates.
    P1: Normal behavioral work. Requires positive behavior, a meaningful teeth/falsification check, and applicable global
      gates.
    P2: Invariant-sensitive work. Requires an explicit or preregistered claim, meaningful adversarial/negative evidence,
      an evidence artifact, applicable global gates, and review of a plausible alternate failure path.
    P3: Settlement-critical work. Requires frozen preregistration, builder evidence, explicit adversarial attacks, fresh
      independent confirmation, and correction/re-confirmation after any failed confirmation.
  proposed_recipe_contracts:
    bootstrap_fixture_rule: T00 binds a real document-integrity and selector test, so bootstrap has an executable check before T00A; it does not select future renderer or integration suites.
    tui-test [selector]: An exact registered suite; omitted selector selects all currently implemented suites, all selects
      full conformance and requires every normative suite.
    tui-bench <selector>: Frozen fixture/runtime/budget inputs; raw samples, workload, percentile, peak memory and pass/fail
      artifact; all-required includes every required benchmark.
    tui-build release: Pinned Bun/OpenTUI native target and lockfile; launch produced artifact in declared terminal.
      Standalone is required only if selected release form.
    tui-preflight bootstrap: Verify approved document hashes, structural schema, graph and recipe selector registry plus runtime inventory. Record unavailable future capabilities as not qualified; they are not selected tests and cannot become passing evidence. This mode never claims runtime conformance.
    tui-preflight conformance: Verify every declared runtime capability, required actual integration and evidence artifact; missing, unsupported or skipped required behavior fails. Reverify document hashes without rebinding.
    tui-preflight: Missing mode is a usage error; no implicit weakening to bootstrap.
    preregistration: Before a P2/P3 implementation, freeze task-gauntlet-tui-prime-workbench-Txx.prereg.yaml and its .prereg.sha256 under the existing research root; verify using just prereg-check gauntlet-tui-prime-workbench-Txx. Record later observations in the corresponding .outcome.yaml without changing the frozen pair.
  independence_contract: A formal critic is read-only in a fresh context and receives the frozen requirements, explicit
    comparison contract and runtime-allowlisted observation only. No builder reasoning, identity, history, attempt counts
    or originating conversation. A verifier may receive the specific claim and immutable instrument evidence; it cannot
    substitute for the critic. Every delegated slice writes a checkpoint and schema-valid result file to its declared
    path. The orchestrator alone decides whole-plan settlement after reviewing all evidence; no sub-agent verdict delegates
    that authority.
  clause_owners:
    sources/core_authority; substrate_baseline; claim_discipline:
    - T00
    core_domain_model; identifiers_and_normalization:
    - T06
    - T08
    - T14
    - T14B
    configuration_and_input_contract; operational_flow_and_state_model:
    - T02
    - T09
    - T16
    execution_integration_contract; reference_algorithms:
    - T01
    - T04
    - T06
    - T09
    - T10
    - T16
    security_safety_trust_boundaries:
    - T02
    - T09
    - T13
    - T15
    - T18
    - T23
    proof_and_observability; repeatability_and_variation; validation_matrix; implementation_definition_of_done:
    - T20
    - T21
    - T22
    - T25
  design_clause_owners:
    rule: DESIGN.md carries normative presentation clauses. They receive the same coverage discipline as spec section-path
      clauses — each DSN ID has an owning task and MUST appear in the conformance report. A DSN clause never widens scope
      beyond its spec basis; where the two could be read apart, the spec basis governs.
