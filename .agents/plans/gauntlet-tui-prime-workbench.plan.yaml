tasks:
  T00:
    title: Freeze source authority, inspect repository, and bind execution gates
    initial_status: ready
    depends_on: []
    proof_level: P1
    confirmation: builder
    settles:
    - REQ-DOM-004
    changes: Binds this plan to the exact source-spec revision, inventories the existing Gauntlet/Prime/DomainForge/TUI
      seams, creates the plan-state/evidence roots, and establishes stable `just tui-*` gate aliases that delegate to
      repository-native checks rather than duplicate them.
    proves: The repository has a reproducible baseline and a cold implementing agent can identify authoritative components,
      current integration seams, target runtime versions, and copy-pasteable global gates before architecture-changing
      work begins.
    does_not_prove: It does not prove any target TUI capability, Prime integration correctness, Bun suitability, or renderer
      behavior.
    hot_context:
    - .agents/specs/gauntlet-tui-prime-workbench.spec.yaml
    - DESIGN.md (normative TUI presentation contract; DSN-001..DSN-015)
    - AGENTS.md and .agents/AGENTS.md if present
    - justfile / package manifests / Cargo workspace manifests
    - 'search: gauntlet serve, event log, state store, Prime/RLM adapter, DomainForge integration, OpenTUI/Bun experiments'
    - existing tests and evidence that pin current CLI/API/runtime behavior
    - substrate_baseline in source spec
    - .agents/reports/gauntlet-tui-prime-workbench/substrate-review.md
    - .agents/reports/gauntlet-tui-prime-workbench/adversarial-inspection-0.3.0.md (F1-F13; the package-root/toolchain decision it left open is now settled in verification.workbench_package_root/workbench_toolchain/workbench_gate_composition below)
    - .agents/CURRENT_STATUS.yml
    - crates/gauntlet-ports/src/operator_surface.rs
    steps:
    - Record inspected source hashes, actual working-tree status and the status of any concurrent workstream (at plan
      revision this is task27; task26 is committed). Do not treat concurrent unfinished changes as settled substrate,
      and do not assume the spec's recorded substrate_baseline commit is still HEAD — re-observe it.
    - Bind approved 0.3.0 spec, DESIGN.md and plan sidecar SHA-256 manifests. All three are source authority; a one-byte
      change to any of them is a mismatch. Verify the Core ruler unchanged. Approval is not execution settlement.
    - Create `workbench/` per verification.workbench_package_root (a new top-level directory, sibling to `crates/`,
      never nested inside a Cargo crate). Initialize its `package.json`, pinned exact-version devDependencies for
      TypeScript and Biome per verification.workbench_toolchain, and commit `workbench/bun.lock`. Add `workbench/node_modules`
      to `.gitignore`. Wire `tui-check`/`tui-test`/`tui-lint`/`tui-preflight` to the recipes verification.workbench_gate_composition
      defines; each may still report NOT_IMPLEMENTED for a mode with no source yet, but MUST NOT report NOT_IMPLEMENTED
      for a mode this task itself makes meaningful (e.g. `tui-lint` over an empty tree is a legitimate pass, not NOT_IMPLEMENTED).
    - Close the surfaces-feature gate hole recorded in gate_binding_rule before dispatching T00A — make a global gate actually
      execute the `surfaces`-enabled test selection, and prove it by breaking one surfaces-gated test and observing the
      gate go red.
    - Pin exact Prime host/runtime schema and OpenTUI package/ABI. Current upstream Prime uses Python REPL JSON-lines
      stdio, not Jupyter sockets. Qualify transport through the host.
    - Inventory DomainForge main envelope versus SXR Slice 0B CEP consumer incompatibility. Record a compatible binary/protocol
      selection or explicit unsupported mode before enriched execution.
    - Freeze Linux/WSL same-host and SSH/tmux terminal support, operation catalog and initial UX fixtures. New hardware
      and remote API deployment remain outside current conformance.
    - Verify the repository copy of the spec has id/version/hash matching this plan; if the spec changes, stop and regenerate/review
      the plan before implementation.
    - Inspect the repository to locate the existing Gauntlet application/core boundary, event/state owners, Prime integration,
      DomainForge seam, current command plane, and any existing TUI/OpenTUI/Bun work. Record OBSERVED vs INFERRED findings
      in the decision log.
    - Inventory actual Bun, OpenTUI, Prime Agent, Python REPL, Rust/Cargo, and DomainForge versions in the target environment.
    - Bind all six proposed recipes — `just tui-check`, `just tui-test`, `just tui-lint`, `just tui-preflight`, `just
      tui-bench`, `just tui-build` — to existing project-native commands or the smallest nonduplicating adapters needed
      to compose them. Recipes whose modes are not yet implementable must exist and report NOT_IMPLEMENTED with a nonzero
      exit, so a later task cannot mistake absence for green.
    - Create current-status, evidence, reports, and preregistration roots; record the baseline commit/worktree state
      and baseline gate outputs.
    gate:
    - just tui-check
    - just tui-test
    - just tui-lint
    - just tui-preflight bootstrap
    teeth:
    - attack: Change the repository spec copy by one byte or use a different spec version/hash and run the plan preflight.
      expected: Execution is blocked as source-authority mismatch; the plan is not silently rebound.
    - attack: Change DESIGN.md by one byte and run the plan preflight.
      expected: Execution is blocked as source-authority mismatch on the design contract, exactly as for the spec.
    - attack: Break one underlying repository-native test while leaving a wrapper untouched.
      expected: The stable gate alias fails because it delegates to the real underlying gate rather than masking it.
    - attack: Break one `surfaces`-feature-gated test in gauntlet-cli and run the repository closure gate.
      expected: The gate fails. If it passes, the workbench read path is unobserved and T00 is not done.
    - attack: Invoke `just tui-bench` and `just tui-build` for a mode nothing implements yet.
      expected: NOT_IMPLEMENTED and a nonzero exit; never a green placeholder and never a usage-error masquerading as success.
    - attack: Place a TypeScript file under `crates/gauntlet-cli/tui/` (nesting the workbench inside a core crate) and
        run `just boundaries`.
      expected: The scan fails on the nested tree (unreadable/non-UTF-8/oversized/symlinked files under a core crate are
        violations, not skips) — proving the `workbench/` placement in verification.workbench_package_root is load-bearing,
        not a style preference.
    - attack: Introduce a formatting-only diff (e.g. inconsistent indentation) under `workbench/` with no lint-rule violation.
      expected: "`just tui-lint` fails; Biomes format-check is part of the gate, not a separate optional step."
    - attack: Delete `workbench/bun.lock` or hand-edit it out of sync with `package.json`, then run `just tui-preflight`.
      expected: The preflight fails — the committed lockfile is load-bearing for `tui-preflight`, the same way `Cargo.lock`
        is for `deny`.
    redesign_trigger: If the current repository does not expose a stable headless Gauntlet core/event boundary or the
      installed Prime/DomainForge/runtime topology materially contradicts the source spec assumptions, stop and classify
      the discrepancy before creating compatibility shims.
    evidence: .agents/reports/gauntlet-tui-prime-workbench/evidence/T00/
    done_when:
    - Every narrow gate exits 0.
    - Every declared teeth/falsification check behaves as specified.
    - All applicable global gates remain green.
    - The source hash is bound, baseline evidence exists, and all four stable gate aliases execute against the actual
      repository with no duplicated oracle logic.
    - All six stable gate aliases (check/test/lint/preflight/bench/build) exist, have declared selector contracts, and
      execute against the actual repository with no duplicated oracle logic.
    - "`workbench/` exists at the decided top-level path with a committed `bun.lock`, is outside every core crate, and
      the repository closure gate demonstrably observes the `surfaces`-gated surface."
    - "`tui-check`/`tui-test`/`tui-lint`/`tui-preflight` are wired to `tsc`, `bun test`, `biome check`, and the dependency-ledger
      plus `bun audit` plus lockfile check respectively, over the real (even if still empty) `workbench/` tree."
  T00A:
    title: Early rendered read-only Gauntlet operator journey
    initial_status: blocked
    depends_on:
    - T00
    proof_level: P1
    confirmation: operator_journey
    settles:
    - REQ-UX-007
    changes: A thin vertical slice using the actual feature-enabled HTTP read surface, Bun and OpenTUI. No new domain
      model or mutation path.
    proves: A cold operator can select a workspace/run, inspect Unit status/tier and verification metadata/evidence references,
      and return using keyboard-only navigation. Preview actions say read-only; unsupported explanation fields say unavailable.
    does_not_prove: Polling is not coherent baseline/event replay; this early slice does not settle final UX, mutation,
      Prime or enriched integration claims.
    hot_context:
    - crates/gauntlet-ports/src/operator_surface.rs
    - crates/gauntlet-cli/src/serve_cmd.rs
    - crates/adapters/gauntlet-adapter-surface-json/src/views.rs
    - REQ-UX-001..007
    - 'DESIGN.md: geometry classes, DSN-002 (colour-independent legibility), DSN-006 (placements), DSN-007 (geometry floors)'
    steps:
    - 'Freeze the two target sizes as the spec floors, not design preference: 120x40 (full layout) and 80x24 (one primary
      pane), with the recoverable compact-size prompt below 80x24 (REQ-UX-005, DSN-007). Render escalation-first Work/Inspector
      navigation.'
    - 'Record the bootstrap dependency admission explicitly. T00 already settled the workbench package root and pinned
      the dev toolchain (TypeScript, Biome — verification.workbench_toolchain); those are not re-admitted here. T03 owns
      the dependency-admission ledger but DEPENDS ON this task, so T00A necessarily admits the first RUNTIME rendering
      dependencies (OpenTUI, any React reconciler it requires) before that ledger gate exists. This is a bounded, recorded
      carve-out, not an exemption: list every dependency added here with version and reason in the T00A evidence, add
      nothing from the REQ-BUN-001 overlap set (local database, PTY, process, server/socket, worker, config parser,
      hashing/compression, packaging), and hand the list to T03 for retroactive qualification. An overlap-set dependency
      added here fails this task.'
    - Bind reads to state/run/unit/escalated response schemas and views.rs verification metadata/evidence refs. Do not
      invent evidence-content endpoints or Unit denial explanations. Render absent fields as unavailable; final full
      inspection depends on T01's explicit canonical read extension and T12 integration.
    - Record keyboard journey, empty/disconnected states and explicit preview read-only state; correct usability defects
      before full host/projection investment.
    - Keep polling explicitly version/freshness-labelled and replace its adapter with T01/T06 synchronization; do not
      build a second long-lived data framework.
    gate:
    - just tui-test operator-preview
    - just tui-check
    teeth:
    - attack: Remove the source, use an empty workspace and navigate at 80x24 without a mouse.
      expected: The user sees a clear next step and can return without a crash, hidden pane or invented state.
    - attack: Shrink the terminal below 80x24 during the journey, then grow it back.
      expected: The recoverable compact-size prompt appears naming the current and required size with a reachable exit;
        growing back re-enters the compact layout with the semantic location intact and terminal modes restored.
    - attack: Add an overlap-set dependency (a SQLite driver, a PTY library, a config parser) to the bootstrap slice.
      expected: The task fails; the overlap set is T03's to adjudicate and the bootstrap carve-out does not cover it.
    evidence: .agents/reports/gauntlet-tui-prime-workbench/evidence/T00A/
    redesign_trigger: If existing reads cannot support the metadata-only preview, record the missing source contract and revise this prerequisite; do not infer data or implement T01 covertly.
    done_when:
    - Actual HTTP read path and rendered keyboard journey recorded; selected tests pass; no mutation introduced.
    - The bootstrap dependency-admission list is written to evidence and referenced by T03.
    - The journey is recorded at both 120x40 and 80x24 and the below-minimum prompt is demonstrated.
  T01:
    title: Canonical Gauntlet state and operation boundary
    initial_status: blocked
    depends_on:
    - T00
    - T00A
    proof_level: P3
    confirmation: independent
    settles:
    - REQ-AFF-001
    - REQ-GOAL-002
    - REQ-OPS-001
    - REQ-OPS-002
    - REQ-OPS-003
    - REQ-STATE-001
    - REQ-STATE-005
    - REQ-SYNC-001
    changes: Establishes one headless application boundary through which the workbench reads canonical Gauntlet state/events
      and submits consequential operation intents, preserving stable canonical operation identities and source ownership.
      This includes request-level actor/session binding and version negotiation on that boundary, which the existing
      feature-gated loopback JSON surface does not have — loopback refusal of non-loopback binds is reachability control,
      not actor authentication. This is predominantly Rust work in the existing application/adapter crates.
    proves: Reference/Run/Unit/evidence/verification/escalation/settlement truth remains owned by Gauntlet,
      and a workbench-requested consequential action cannot become a presentation-specific side effect.
    does_not_prove: It does not prove local projection reconstruction, cross-surface affordance equivalence, Prime lifecycle,
      or OpenTUI behavior.
    preregistration:
      required: true
      artifact: .agents/research/preregistrations/task-gauntlet-tui-prime-workbench-T01.prereg.yaml
      claims:
      - Reference/Run/Unit/evidence/verification/escalation/settlement truth remains owned by Gauntlet, and
        a workbench-requested consequential action cannot become a presentation-specific side effect.
      falsifiers:
      - Implement a TUI-side helper that mutates settlement/evidence state without the canonical Gauntlet operation path.
      - Replay a canonical event/read through the headless boundary with no renderer, SQLite read model, or Prime session
        present.
      known_confounds:
      - Existing repository behavior may be incomplete, stale, or implemented through a seam not yet discovered by the
        builder.
      confirmation_condition: The declared narrow gate and teeth pass with evidence sufficient for the stated proof level.
    hot_context:
    - 'source spec: core_domain_model and REQ-STATE/REQ-AFF'
    - existing gauntlet serve / CLI command handlers
    - existing event log/state store and operation/application services
    - crates/gauntlet-app/src/govern/gate.rs and existing settlement authority
    steps:
    - Define the missing Unit inspection read contract over existing Reference/answer-key parsing, verification records,
      escalation tickets and EvidenceStore. Return source identity, requirement, evidence references, bounded content and
      current denial/precondition explanation from owning services; validate digests and scope, preserve unknowns, and
      make T12 depend on this contract for full inspection while T00A remains metadata-only.
    - Bind Case/WorkItem/AttentionItem to source-spec vocabulary projections, not new canonical aggregates. Preserve
      RunId/UnitId/TicketId and existing application ownership.
    - Preserve execute_operator_action and the settlement service. Extract reusable composition only when needed; CLI
      and JSON retain parity including locks, typed refusals and existing tests.
    - Treat command capability handshake, baseline watermark/cursor bridge and long-lived invocation owner as new work.
      Do not claim the current seven-route JSON adapter already provides them.
    - Identify the existing application-layer read and command seams beneath CLI/serve; reuse them rather than making
      the TUI call/parse CLI output.
    - Define or bind stable canonical operation IDs and result/error envelopes without changing existing domain meaning.
    - Expose canonical read/event references needed by the workbench without giving the workbench direct mutation authority.
    - Bind every request on the operation boundary to the configured actor/session identity and validate host/origin or
      equivalent channel identity; never accept client-asserted authority. Authentication and version negotiation precede
      any mutation. A transport failure may not fall back to a direct store write or a shell. Preserve the existing
      loopback-only bind refusal; it is additive to, not a substitute for, this binding.
    - Add provenance/correlation sufficient to trace one workbench intent through Gauntlet admission and its resulting
      canonical event/result.
    - Document source ownership for every state class that can look consequential in the TUI.
    gate:
    - just tui-test canonical-boundary
    - just tui-check
    - just check-package gauntlet-app
    - just test-package gauntlet-app
    - just test-package gauntlet-cli
    - just test-package gauntlet-adapter-surface-json
    teeth:
    - attack: Present a well-formed mutation request on the operation boundary with no bound actor/session, or with a
        client-asserted actor, from a loopback client.
      expected: Refused before any consequential side effect. Loopback reachability alone never authorises a mutation.
    - attack: Implement a TUI-side helper that mutates settlement/evidence state without the canonical Gauntlet operation
        path.
      expected: The test or architecture gate rejects it; no consequential state change is possible through the side
        path.
    - attack: Replay a canonical event/read through the headless boundary with no renderer, SQLite read model, or Prime
        session present.
      expected: The canonical result remains available and correctly identified.
    redesign_trigger: If the current CLI/serve handlers themselves own business semantics rather than delegating to a
      reusable application/core layer, stop and extract/bind that layer before adding a TUI-specific API.
    evidence: .agents/reports/gauntlet-tui-prime-workbench/evidence/T01/
    independent_confirmation:
      verifier_receives:
      - Frozen source requirements and explicit comparison/verification contract
      - Runtime-allowlisted observation bundle and immutable instrument results
      - Relevant implementation and exact bounded confirmation question
      verifier_should_not_receive:
      - Builder reasoning, identity, conversational history, attempt counts or originating conversation
      required_verdict: CONFIRM_CANONICALITY
    done_when:
    - Every narrow gate exits 0.
    - Every declared teeth/falsification check behaves as specified.
    - All applicable global gates remain green.
    - A fresh verifier can trace representative canonical reads and mutations to Gauntlet ownership and finds no workbench-owned
      consequential mutation path.
