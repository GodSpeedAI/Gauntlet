      - Runtime-allowlisted observation bundle and immutable instrument results
      - Relevant implementation and exact bounded confirmation question
      verifier_should_not_receive:
      - Builder reasoning, identity, conversational history, attempt counts or originating conversation
      required_verdict: CONFIRM_PRIME_HOST
    done_when:
