      the orchestrator records settlement.
final_acceptance:
  canonicality_and_isomorphism:
  - Gauntlet remains the only authority for consequential Reference/Run/Unit/evidence/verification/escalation/settlement
    operation state.
  - Allowed and denied operations are independently proven isomorphic across every supported projection and direct adapter
    route.
  - Deleting all Bun SQLite/TUI/kernel projection state cannot destroy or manufacture canonical truth.
  operator_world:
  - The operator can navigate a Case by stable Focus identity, multiple placements, hoistable Horizons, Work/Chat/Trace,
    Inspector, Composer takeover, and contextual lower surfaces.
  - Progressive Affordance Materialization measurably shapes subscriptions, SQLite queries, prefetch, Prime context,
    and visible/current actions rather than only UI controls.
  - DomainForge semantic enrichment is source-identified when present and safely absent when not bound.
  - REQ-UX-001..007 real-PTY keyboard journeys and cold-operator evidence pass, including the 120x40 full layout, the
    80x24 single primary pane, and the recoverable compact-size prompt below that.
  - DESIGN.md clauses DSN-001..DSN-015 have settled evidence and no roadmap surface (Harness View, rich semantic overlay,
    second production renderer) was built.
  - Explicit source bindings connect DomainForge declarations and SXR ledger evidence in existing views; incompatible
    producer/consumer contracts remain blocked.
  prime_kernel_and_long_running_execution:
  - Actual Prime sessions/children/topology are projected through a structured headless interface; child admission is
    nonblocking and mailbox/liveness are not completion.
  - One Python REPL session remains serialized; parallel open-ended work uses independent Prime contexts; kernel object/evidence
    boundaries are explicit.
  - Authorized Prime work survives TUI detachment and reattaches from authoritative Prime/Gauntlet state on the real
    target.
  bun_opentui_and_composition:
  - Every overlapping local runtime dependency is either absent or justified by native-substrate qualification evidence.
  - OpenTUI/React consume immutable React-free Workbench snapshots and can be removed/replaced without changing canonical
    Gauntlet/Prime semantics.
  - Trusted plugins unload reversibly; untrusted extensions cannot execute in-process; the selected embedded terminal
    path passes required fidelity/security evidence.
  variation_recovery_and_payment:
  - VAR-001 through VAR-006 and RECOV-001 through RECOV-006 applicable to the declared support matrix pass with stored
    evidence.
  - Representative large-Case/long-history workloads meet frozen latency/resource/materialization budgets without eager
    whole-world loading.
  - Local and SSH/remote target modes preserve application semantics and the selected Bun/OpenTUI release form runs on
    actual target hardware.
  evidence_and_confirmation:
  - Every REQUIRED normative spec requirement maps to at least one settled task/evidence record.
  - Every P3 task has the required fresh independent confirmation.
  - Failed/correction evidence has not been erased.
  - Documentation/status claims do not exceed observed proof.
  - All global gates exit 0.
  - Independent bounded conformance is confirmed; the orchestrator independently reviews total evidence and records whole-plan
    settlement before reporting none — plan settled.
guardrails:
- Do not make CLI presentation output, Prime terminal UI, notebook cells, React/OpenTUI components, local SQLite, or
  mailbox content canonical.
- Do not create a parallel agent/session lifecycle model when Prime already owns the real session/child topology.
- Do not hardcode machine/provider/runtime facts when the project config/secret hierarchy can represent them.
- Do not hide provider/model/transport fallback or projection staleness; degraded/failure state must be visible and fail
  closed where consequential.
- Do not treat a passing test, Prime heartbeat, message, kernel variable, or one successful execution as Gauntlet settlement/capability
  unless the owning contract explicitly establishes it.
- Do not expand roadmap items—libvaxis fallback, rich semantic overlays, multi-renderer products, harness-metabolization
  UI—beyond the current seam required by the spec.
handoff_contract:
  must_report:
  - settled capabilities/requirements
  - explicitly unsettled or deferred items
  - current operational system state
  - requirement-to-evidence index
  - known limitations
  - rollback/recovery instructions where relevant
  - important decisions/discoveries that changed the execution model
  - exact next executable action or 'none — plan settled'
  settled_next_action_rule: Only the orchestrator may record none — plan settled after T25 bounded independent confirmation
    and its own total-system evidence review. Missing clauses, source composition, required real integrations or recovery
    evidence keep the plan open.
