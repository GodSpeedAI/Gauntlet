      Prime sessions, children, identifiers, parent-child topology, session references, model identity, lifecycle, and
      messages without synthesizing parallel execution truth.
    proves: Prime child admission is nonblocking, mailbox content remains communication rather than completion, and the
      TUI can reconstruct actual recursive topology from Prime/Gauntlet sources without scraping Prime's terminal UI.
    does_not_prove: It does not prove Python REPL execution serialization, long-running detach/reattach, contextual horizon
