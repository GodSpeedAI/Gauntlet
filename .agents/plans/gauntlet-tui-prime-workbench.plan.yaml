dispatch_contract:
  rule: T01-T25 are capability milestones, not single builder assignments. Before dispatch, split each into bounded sequential
    vertical slices with at most five expected files, explicit requirement IDs, application owner, dependencies, falsifier,
    canonical test command and result-contract path. No builder receives a whole milestone by default.
  blocking_condition: A missing operation contract, unqualified external protocol or slice crossing independent subsystems
    blocks that slice until its contract is made concrete; do not fabricate source capabilities.
  early_slices:
    T01:
    - Existing RuntimeSnapshot JSON contract and existing resolve/retry parity
    - Versioned capability and command-result/precondition schema
    - Atomic baseline/watermark and bounded event bridge
    - Canonical invocation admission/reconciliation with durable process owner
    T12:
    - Work navigation and Unit/Inspector evidence journey
    - Chat/Trace provenance and stable cross-view selection
    - Queued composer attention, stale answer handling and keyboard safety
    - Responsive layout and real-PTY journey acceptance
    T14B:
    - Qualified SXR refresh/export parser and explicit identity association
    - Read-only evidence/ledger lens and evidence-admission boundary
    - Real producer-consumer-workbench composition and failure matrix
