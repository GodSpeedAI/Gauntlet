    - attack: Spawn nested Prime children and restart only the workbench adapter process.
      expected: The adapter re-reads actual Prime topology/identities rather than minting synthetic replacements.
    redesign_trigger: If the installed Prime version lacks a stable structured headless carrier for a required operation,
