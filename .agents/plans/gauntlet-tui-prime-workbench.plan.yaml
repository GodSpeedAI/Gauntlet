      session lifetime; Bun must not own admitted work or reconnect by scraping directories.
    - Select the narrowest documented structured Prime host interface meeting the required session, lifecycle and input
      contracts; pin version/schema. ACP/JSON are not interchangeable without contract evidence.
    - Map actual Prime session/child IDs, parent-child relations, models, session refs, lifecycle, messages, and result
