schema: agent.development_plan
schema_version: '1.0'
metadata:
  id: gauntlet-tui-prime-workbench
  title: Gauntlet Prime-Native Terminal Workbench — Development Settlement Plan
  status: approved
  version: 0.3.0
  created: '2026-09-06'
  revised: '2026-09-08'
  approval:
    date: '2026-09-06'
    authority: Operator instruction to refine, approve, and rehash these documents.
    scope: Design approval only; no implementation settlement or runtime qualification is asserted.
    review: .agents/reports/gauntlet-tui-prime-workbench/review.md
    review_supplement: .agents/reports/gauntlet-tui-prime-workbench/adversarial-inspection-0.3.0.md
  purpose: Project the frozen Gauntlet Prime-Native Terminal Workbench normative specification into an affordance/dependency
    settlement graph that first preserves canonical Gauntlet authority, then exploits Prime/Python/Bun/OpenTUI/DomainForge
    native substrates, then proves the operator workbench through destructive recovery and fresh independent confirmation.
    This plan is approved for planning at the bound source hashes; T00 and all implementation gates remain unexecuted.
  amendments:
  - version: 0.3.0
    date: '2026-09-08'
    reason: Adversarial cross-artifact inspection of spec + plan + DESIGN.md before T00 dispatch. No task, dependency
      edge, requirement mapping, or acceptance condition was weakened.
    changes:
    - Re-pinned the source spec at 0.3.0 and bound DESIGN.md as a second normative source with its own hash; the design
      contract was previously unreferenced by both spec and plan and therefore unenforceable.
    - Corrected the factual claim about `just verify`. It does NOT currently run any `surfaces`-feature test, and the
      whole workbench read path sits behind that feature. T00 now owns closing that hole.
    - T00 now binds all six proposed recipes (check/test/lint/preflight/bench/build), not four, matching gate_binding_rule.
    - Declared the confirmation-mode vocabulary; `operator_journey` was used by T00A without a definition.
    - Recorded the T00A bootstrap dependency-admission carve-out, which T03's ledger must absorb (T03 depends on T00A,
      so T00A necessarily admits the first runtime dependencies before the ledger gate exists).
    - Named request-level actor/session authentication and version negotiation on the Gauntlet operation bridge as T01
      work; no task previously claimed it in its `changes`.
    - Settled the workbench package-root/toolchain decision the inspection report left open — `workbench/` as a new
      top-level directory (verification.workbench_package_root), TypeScript + Biome as the pinned dev toolchain
      (verification.workbench_toolchain), and each Rust gate's TypeScript counterpart (verification.workbench_gate_composition).
      T00 now scaffolds the package and toolchain directly; T00A's bootstrap carve-out is narrowed to the runtime rendering
      dependencies (OpenTUI, a React reconciler) it still admits ahead of T03's ledger.
    - Added DSN-001..DSN-015 design-clause ownership so the design contract has the same coverage discipline as the spec.
    - Replaced the stale `task26` reference in T00 (task26 is committed; task27 is the concurrent workstream).
source:
  spec:
    intended_repository_path: .agents/specs/gauntlet-tui-prime-workbench.spec.yaml
    artifact_name: gauntlet-tui-prime-workbench.spec.yaml
    spec_id: gauntlet-tui-prime-workbench
    spec_version: 0.3.0
    sha256: d66203651461fd1189a8d10b6649b09473b423d8f2f501e3508034d52cb9f00b
    authority: normative
  design:
    intended_repository_path: DESIGN.md
    artifact_name: DESIGN.md
    sha256: 02ce58a257ec1240840338535cab218be77e0507abe22ea836dda77cad9944e3
    authority: normative_presentation
    precedence: Subordinate to the spec. Governs TUI visual/interaction presentation and the DSN-001..DSN-015 design
      conformance clauses. On any disagreement with the spec, the spec governs and DESIGN.md is corrected — never the
      reverse, and never silently.
  supporting_sources:
  - path: AGENTS.md
    role: Repository role boundaries, canonical verification and evidence discipline.
  - path: crates/gauntlet-cli/src/serve_cmd.rs
    role: Observed feature-gated loopback server; not a general workbench API.
  - path: https://github.com/PrimeIntellect-ai/prime-agent
    role: Installed-version Prime Agent/RLM/Python REPL/headless-host capability evidence; actual target version must
      be inspected and pinned.
  - path: https://bun.com/reference/bun
    role: Bun 1.4 native-substrate capability evidence to qualify before admitting overlapping dependencies.
  - path: https://opentui.com/docs/
    role: OpenTUI rendering, terminal, runtime-module, and packaging capability evidence.
  - path: https://github.com/deepseek-ai/deepseek-harness
    role: Non-normative donor for authoritative host state, reconnect generation, immutable projection, and reversible
      composition rigor.
target_settlement: A real operator can open or resume a Gauntlet Case in a terminal-native workbench, narrow the active
  Horizon around a Focus, see source-identified relations/agents/artifacts/evidence/history and current spendable actions
  become locally adjacent, invoke or delegate a legitimate operation through any supported projection with one canonical
  Gauntlet admission path, observe Prime/Python execution and evidence live, detach/reconnect without terminating authorized
  work, and fully reconstruct consequential state after deleting all noncanonical workbench/kernel/renderer state. The
  result must hold on the declared real target environment under variation, recovery, performance, plugin, DomainForge-present/absent,
  and independent adversarial confirmation.
operating_contract:
  core_principle: Gauntlet owns consequence; the workbench owns adjacency. No Bun/OpenTUI/React/SQLite/kernel/Prime-message
    projection may become the place where Reference, authority, evidence, completion, settlement, or capability becomes
    true.
  rules:
  - Execute tasks by dependency, not by narrative order.
  - Independent tasks MAY run in parallel only after all declared dependencies are settled.
  - Every task MUST leave the repository in a coherent state with all applicable global gates green.
  - A task is not complete because code exists, a process starts once, the builder reports success, or a happy-path test
    passes.
  - A passing gate proves only what that gate actually observes.
  - High-risk P3 work requires fresh independent/adversarial confirmation.
  - Do not generalize from one observation unless the normative requirement is itself general.
  - Do not silently widen domain, schema, API, config, service, or authority surfaces when an existing representation
    can preserve the required distinction.
  - Runtime/machine/provider-specific facts belong in the project's established config/secret hierarchy rather than scattered
    hardcoding.
  - Preserve failed evidence and correction history.
  - Do not add an overlapping local database, PTY, process, socket/server, worker, config, hashing/compression, packaging,
    or terminal dependency until the corresponding Bun/Prime/Python/OpenTUI native capability has been qualified and
    evidence shows the dependency is needed.
  - Do not make one Python REPL session a concurrent execution scheduler; sequential deterministic work stays in one
    kernel and justified parallel open-ended work uses independent Prime contexts.
  - Every consequential action exposed anywhere MUST reference the same canonical Gauntlet operation/admission path;
    no projection may own a privileged shortcut.
  - Focus/Horizon is allowed to reshape projection, subscriptions, queries, prefetch, and agent context, but never canonical
    source identity or truth.
  claim_states:
  - OBSERVED
  - INFERRED
  - DECIDED
  - ASSUMED
  - UNKNOWN
  correction_protocol:
  - Preserve the failed evidence.
  - 'Classify the failure: implementation, oracle/test, representation, missing prerequisite, environmental confound,
    or source-spec ambiguity.'
  - Determine whether the governing requirement/invariant remains valid.
  - Correct the smallest falsified layer.
  - Rerun the original teeth/falsification check.
  - Rerun the original confirmation path.
  - Append the correction round; do not erase the failed round.
  - Do not weaken acceptance merely because the implementation repeatedly fails it.
  scope_control: A newly discovered issue enters the current plan only when it blocks a normative requirement or is itself
    required by the source specification. Valuable but independent discoveries become future debt/plans. Attractive architecture
    with no requirement is rejected from current scope. Roadmap items in the source spec remain seams only unless a current
    task requires their boundary for conformance.
